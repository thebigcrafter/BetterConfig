name: Run tests and static analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test and analyze PHP code
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP environment
        uses: shivammathur/setup-php@0b3aa3e956e05acdd8d6d246bce4a2010b36df7a
        with:
          php-version: '8.2'
          coverage: none

      - name: Install locked Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run BetterConfig smoke test
        run: composer smoke

      - name: Run PHPStan at maximum level
        run: composer analyse
