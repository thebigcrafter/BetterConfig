name: Run tests and static analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test and analyze PHP code
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP environment
        uses: shivammathur/setup-php@5a89ae6dd61c772780c51d7542f4374d76990a0b
        with:
          php-version: '8.2'
          coverage: none

      - name: Install locked Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run BetterConfig smoke test
        run: composer smoke

      - name: Run PHPStan at maximum level
        run: composer analyse
